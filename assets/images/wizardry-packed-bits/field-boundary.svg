<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="735" viewBox="0 0 1400 735" role="img" aria-labelledby="title desc">
<title id="title">A field can cross into the next byte</title><desc id="desc">An illustrative field at index 2 with width 3 starts at offset 6 and occupies offsets 6, 7 and 8 across two bytes. Highlights mark the positions, not field value significance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#006d77"/></marker></defs>
<rect width="1400" height="735" fill="#fff"/>
<text x="52" y="70" font-family="Arial, sans-serif" font-size="42" fill="#172c38" font-weight="700" text-anchor="start">A field can cross into the next byte</text><text x="52" y="125" font-family="Arial, sans-serif" font-size="31" fill="#172c38" font-weight="400" text-anchor="start">Field index 2, width 3 bits → starting bit offset 2 × 3 = 6</text><rect x="52" y="160" width="1296" height="75" rx="8" fill="#e7f4f4" stroke="#006d77" stroke-width="2"/><text x="80" y="208" font-family="Arial, sans-serif" font-size="32" fill="#006d77" font-weight="700" text-anchor="start">6 ÷ 8 = byte index 0, bit position 6</text><text x="65" y="335" font-family="Arial, sans-serif" font-size="29" fill="#172c38" font-weight="700" text-anchor="start">Byte index 0</text><rect x="340" y="290" width="63" height="66" rx="8" fill="#006d77" stroke="#006d77" stroke-width="2"/><text x="371.5" y="334" font-family="Consolas, monospace" font-size="32" fill="#fff" font-weight="700" text-anchor="middle">7</text><text x="371.5" y="275" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">7</text><rect x="408" y="290" width="63" height="66" rx="8" fill="#006d77" stroke="#006d77" stroke-width="2"/><text x="439.5" y="334" font-family="Consolas, monospace" font-size="32" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="439.5" y="275" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">6</text><rect x="476" y="290" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="507.5" y="334" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">5</text><text x="507.5" y="275" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">5</text><rect x="544" y="290" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="575.5" y="334" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">4</text><text x="575.5" y="275" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">4</text><rect x="612" y="290" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="643.5" y="334" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">3</text><text x="643.5" y="275" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">3</text><rect x="680" y="290" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="711.5" y="334" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">2</text><text x="711.5" y="275" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">2</text><rect x="748" y="290" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="779.5" y="334" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">1</text><text x="779.5" y="275" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">1</text><rect x="816" y="290" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="847.5" y="334" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">0</text><text x="847.5" y="275" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">0</text><text x="965" y="320" font-family="Arial, sans-serif" font-size="29" fill="#006d77" font-weight="700" text-anchor="start">First two bits</text><text x="65" y="475" font-family="Arial, sans-serif" font-size="29" fill="#172c38" font-weight="700" text-anchor="start">Byte index 1</text><rect x="340" y="430" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="371.5" y="474" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">7</text><text x="371.5" y="415" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">15</text><rect x="408" y="430" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="439.5" y="474" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">6</text><text x="439.5" y="415" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">14</text><rect x="476" y="430" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="507.5" y="474" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">5</text><text x="507.5" y="415" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">13</text><rect x="544" y="430" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="575.5" y="474" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">4</text><text x="575.5" y="415" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">12</text><rect x="612" y="430" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="643.5" y="474" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">3</text><text x="643.5" y="415" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">11</text><rect x="680" y="430" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="711.5" y="474" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">2</text><text x="711.5" y="415" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">10</text><rect x="748" y="430" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="779.5" y="474" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">1</text><text x="779.5" y="415" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">9</text><rect x="816" y="430" width="63" height="66" rx="8" fill="#006d77" stroke="#006d77" stroke-width="2"/><text x="847.5" y="474" font-family="Consolas, monospace" font-size="32" fill="#fff" font-weight="700" text-anchor="middle">0</text><text x="847.5" y="415" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">8</text><text x="965" y="465" font-family="Arial, sans-serif" font-size="29" fill="#006d77" font-weight="700" text-anchor="start">Remaining bit</text><text x="52" y="590" font-family="Arial, sans-serif" font-size="31" fill="#172c38" font-weight="700" text-anchor="start">The field occupies buffer offsets 6, 7 and 8.</text><text x="52" y="640" font-family="Arial, sans-serif" font-size="27" fill="#465e6b" font-weight="400" text-anchor="start">A three-bit field can cross a byte boundary. Its width alone does not</text><text x="52" y="680" font-family="Arial, sans-serif" font-size="27" fill="#465e6b" font-weight="400" text-anchor="start">tell us how many bytes the routine needs to access.</text></svg>