<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1125" viewBox="0 0 1400 1125" role="img" aria-labelledby="title desc">
<title id="title">What changes from Wizardry VI to VII</title><desc id="desc">Five rows compare each routine length in bytes. Write bit 46 to 51, read bit 43 to 48, write field 75 to 82, read field 61 to 68, scalar 35 to 40. All gain CLD and MOV AX,DS and MOV ES,AX. Two field functions also gain PUSH ES and POP ES. The 200 algorithm body bytes are identical.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#006d77"/></marker></defs>
<rect width="1400" height="1125" fill="#fff"/>
<text x="52" y="70" font-family="Arial, sans-serif" font-size="42" fill="#172c38" font-weight="700" text-anchor="start">What changes from Wizardry VI to VII</text><text x="52" y="125" font-family="Arial, sans-serif" font-size="30" fill="#172c38" font-weight="400" text-anchor="start">The bit-handling code stays the same. VII adds setup.</text><text x="52" y="195" font-family="Arial, sans-serif" font-size="27" fill="#465e6b" font-weight="700" text-anchor="start">Routine</text><text x="500" y="195" font-family="Arial, sans-serif" font-size="27" fill="#465e6b" font-weight="700" text-anchor="start">VI</text><text x="665" y="195" font-family="Arial, sans-serif" font-size="27" fill="#465e6b" font-weight="700" text-anchor="start">VII</text><text x="820" y="195" font-family="Arial, sans-serif" font-size="27" fill="#465e6b" font-weight="700" text-anchor="start">Added in VII</text><rect x="52" y="225" width="1296" height="76" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="72" y="273" font-family="Arial, sans-serif" font-size="30" fill="#172c38" font-weight="700" text-anchor="start">Write one bit</text><text x="500" y="273" font-family="Consolas, monospace" font-size="31" fill="#172c38" font-weight="400" text-anchor="start">46</text><text x="665" y="273" font-family="Consolas, monospace" font-size="31" fill="#172c38" font-weight="400" text-anchor="start">51</text><text x="820" y="272" font-family="Arial, sans-serif" font-size="29" fill="#006d77" font-weight="700" text-anchor="start">+5 bytes</text><text x="1010" y="272" font-family="Arial, sans-serif" font-size="24" fill="#172c38" font-weight="400" text-anchor="start">Setup</text><rect x="52" y="317" width="1296" height="76" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="72" y="365" font-family="Arial, sans-serif" font-size="30" fill="#172c38" font-weight="700" text-anchor="start">Read one bit</text><text x="500" y="365" font-family="Consolas, monospace" font-size="31" fill="#172c38" font-weight="400" text-anchor="start">43</text><text x="665" y="365" font-family="Consolas, monospace" font-size="31" fill="#172c38" font-weight="400" text-anchor="start">48</text><text x="820" y="364" font-family="Arial, sans-serif" font-size="29" fill="#006d77" font-weight="700" text-anchor="start">+5 bytes</text><text x="1010" y="364" font-family="Arial, sans-serif" font-size="24" fill="#172c38" font-weight="400" text-anchor="start">Setup</text><rect x="52" y="409" width="1296" height="76" rx="8" fill="#e7f4f4" stroke="#c3d1d8" stroke-width="2"/><text x="72" y="457" font-family="Arial, sans-serif" font-size="30" fill="#172c38" font-weight="700" text-anchor="start">Write a field</text><text x="500" y="457" font-family="Consolas, monospace" font-size="31" fill="#172c38" font-weight="400" text-anchor="start">75</text><text x="665" y="457" font-family="Consolas, monospace" font-size="31" fill="#172c38" font-weight="400" text-anchor="start">82</text><text x="820" y="456" font-family="Arial, sans-serif" font-size="29" fill="#006d77" font-weight="700" text-anchor="start">+7 bytes</text><text x="1010" y="456" font-family="Arial, sans-serif" font-size="24" fill="#172c38" font-weight="400" text-anchor="start">Setup + save/restore ES</text><rect x="52" y="501" width="1296" height="76" rx="8" fill="#e7f4f4" stroke="#c3d1d8" stroke-width="2"/><text x="72" y="549" font-family="Arial, sans-serif" font-size="30" fill="#172c38" font-weight="700" text-anchor="start">Read a field</text><text x="500" y="549" font-family="Consolas, monospace" font-size="31" fill="#172c38" font-weight="400" text-anchor="start">61</text><text x="665" y="549" font-family="Consolas, monospace" font-size="31" fill="#172c38" font-weight="400" text-anchor="start">68</text><text x="820" y="548" font-family="Arial, sans-serif" font-size="29" fill="#006d77" font-weight="700" text-anchor="start">+7 bytes</text><text x="1010" y="548" font-family="Arial, sans-serif" font-size="24" fill="#172c38" font-weight="400" text-anchor="start">Setup + save/restore ES</text><rect x="52" y="593" width="1296" height="76" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="72" y="641" font-family="Arial, sans-serif" font-size="30" fill="#172c38" font-weight="700" text-anchor="start">Bits from a number</text><text x="500" y="641" font-family="Consolas, monospace" font-size="31" fill="#172c38" font-weight="400" text-anchor="start">35</text><text x="665" y="641" font-family="Consolas, monospace" font-size="31" fill="#172c38" font-weight="400" text-anchor="start">40</text><text x="820" y="640" font-family="Arial, sans-serif" font-size="29" fill="#006d77" font-weight="700" text-anchor="start">+5 bytes</text><text x="1010" y="640" font-family="Arial, sans-serif" font-size="24" fill="#172c38" font-weight="400" text-anchor="start">Setup</text><text x="52" y="735" font-family="Arial, sans-serif" font-size="29" fill="#172c38" font-weight="700" text-anchor="start">All five gain</text><rect x="52" y="765" width="610" height="148" rx="8" fill="#e7f4f4" stroke="#006d77" stroke-width="2"/><text x="78" y="806" font-family="Consolas, monospace" font-size="30" fill="#006d77" font-weight="400" text-anchor="start">+ cld</text><text x="78" y="849" font-family="Consolas, monospace" font-size="30" fill="#006d77" font-weight="400" text-anchor="start">+ mov ax, ds</text><text x="78" y="892" font-family="Consolas, monospace" font-size="30" fill="#006d77" font-weight="400" text-anchor="start">+ mov es, ax</text><text x="750" y="735" font-family="Arial, sans-serif" font-size="29" fill="#172c38" font-weight="700" text-anchor="start">The two field functions also gain</text><rect x="750" y="765" width="598" height="148" rx="8" fill="#e7f4f4" stroke="#006d77" stroke-width="2"/><text x="776" y="813" font-family="Consolas, monospace" font-size="30" fill="#006d77" font-weight="400" text-anchor="start">+ push es</text><text x="776" y="856" font-family="Consolas, monospace" font-size="26" fill="#465e6b" font-weight="400" text-anchor="start">  ... function ...</text><text x="776" y="899" font-family="Consolas, monospace" font-size="30" fill="#006d77" font-weight="400" text-anchor="start">+ pop es</text><text x="52" y="974" font-family="Arial, sans-serif" font-size="34" fill="#172c38" font-weight="700" text-anchor="start">260 bytes → 289 bytes</text><text x="52" y="1025" font-family="Arial, sans-serif" font-size="32" fill="#006d77" font-weight="700" text-anchor="start">All 200 bytes that manipulate the bits are unchanged.</text></svg>