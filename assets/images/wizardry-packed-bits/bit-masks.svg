<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="925" viewBox="0 0 1400 925" role="img" aria-labelledby="title desc">
<title id="title">Change one bit while writing a byte</title><desc id="desc">Two examples highlight bit 5. OR with 00100000 sets it; AND with 11011111 clears it. The other seven bits are unchanged. Illustrative byte-memory assembly is shown under each.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#006d77"/></marker></defs>
<rect width="1400" height="925" fill="#fff"/>
