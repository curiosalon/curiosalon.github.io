<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730" role="img" aria-labelledby="title desc">
<title id="title">Find the byte, then find the bit</title><desc id="desc">Offset 13 selects byte index 1 and bit position 5. Buffer offsets 15 through 8 are shown over the second byte, with offset 13 highlighted.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#006d77"/></marker></defs>
<rect width="1400" height="730" fill="#fff"/>
<text x="52" y="70" font-family="Arial, sans-serif" font-size="42" fill="#172c38" font-weight="700" text-anchor="start">Find the byte, then find the bit</text><text x="52" y="125" font-family="Arial, sans-serif" font-size="29" fill="#172c38" font-weight="400" text-anchor="start">Start with bit offset 13. Count both bytes and bits from zero.</text><rect x="52" y="160" width="620" height="95" rx="8" fill="#e7f4f4" stroke="#006d77" stroke-width="2"/><text x="78" y="200" font-family="Arial, sans-serif" font-size="34" fill="#006d77" font-weight="700" text-anchor="start">13 ÷ 8 = 1 remainder 5</text><text x="78" y="235" font-family="Arial, sans-serif" font-size="28" fill="#172c38" font-weight="400" text-anchor="start">Byte index 1 • bit position 5</text><text x="65" y="340" font-family="Arial, sans-serif" font-size="29" fill="#172c38" font-weight="700" text-anchor="start">Byte index 0</text><rect x="340" y="300" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="371.5" y="344" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">7</text><text x="371.5" y="285" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">7</text><rect x="408" y="300" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="439.5" y="344" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">6</text><text x="439.5" y="285" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">6</text><rect x="476" y="300" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="507.5" y="344" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">5</text><text x="507.5" y="285" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">5</text><rect x="544" y="300" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="575.5" y="344" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">4</text><text x="575.5" y="285" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">4</text><rect x="612" y="300" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="643.5" y="344" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">3</text><text x="643.5" y="285" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">3</text><rect x="680" y="300" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="711.5" y="344" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">2</text><text x="711.5" y="285" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">2</text><rect x="748" y="300" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="779.5" y="344" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">1</text><text x="779.5" y="285" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">1</text><rect x="816" y="300" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="847.5" y="344" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">0</text><text x="847.5" y="285" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">0</text><text x="65" y="475" font-family="Arial, sans-serif" font-size="29" fill="#172c38" font-weight="700" text-anchor="start">Byte index 1</text><rect x="340" y="435" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="371.5" y="479" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">7</text><text x="371.5" y="420" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">15</text><rect x="408" y="435" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="439.5" y="479" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">6</text><text x="439.5" y="420" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">14</text><rect x="476" y="435" width="63" height="66" rx="8" fill="#006d77" stroke="#006d77" stroke-width="2"/><text x="507.5" y="479" font-family="Consolas, monospace" font-size="32" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="507.5" y="420" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">13</text><rect x="544" y="435" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="575.5" y="479" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">4</text><text x="575.5" y="420" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">12</text><rect x="612" y="435" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="643.5" y="479" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">3</text><text x="643.5" y="420" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">11</text><rect x="680" y="435" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="711.5" y="479" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">2</text><text x="711.5" y="420" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">10</text><rect x="748" y="435" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="779.5" y="479" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">1</text><text x="779.5" y="420" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">9</text><rect x="816" y="435" width="63" height="66" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="847.5" y="479" font-family="Consolas, monospace" font-size="32" fill="#172c38" font-weight="700" text-anchor="middle">0</text><text x="847.5" y="420" font-family="Arial, sans-serif" font-size="22" fill="#465e6b" font-weight="400" text-anchor="middle">8</text><text x="340" y="560" font-family="Arial, sans-serif" font-size="25" fill="#465e6b" font-weight="400" text-anchor="start">Labels above the boxes are bit offsets in the buffer.</text><text x="1030" y="405" font-family="Arial, sans-serif" font-size="28" fill="#006d77" font-weight="700" text-anchor="middle">Offset 13 selects this bit</text><path d="M1030,425 L1030,520 L508,520 L508,503" stroke="#006d77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="52" y="630" font-family="Arial, sans-serif" font-size="26" fill="#465e6b" font-weight="400" text-anchor="start">Within each byte, bit 7 is on the left and bit 0 is on the right.</text><text x="52" y="675" font-family="Arial, sans-serif" font-size="30" fill="#172c38" font-weight="700" text-anchor="start">The routine accesses byte 1, then uses a mask to select bit 5.</text></svg>