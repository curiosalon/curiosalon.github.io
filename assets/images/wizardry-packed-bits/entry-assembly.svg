<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">The extra instructions prepare the machine</title><desc id="desc">CLD is one byte. MOV AX,DS and MOV ES,AX are two bytes each. Five functions gain five bytes each, with four additional save and restore bytes in the field functions, totaling 29.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#006d77"/></marker></defs>
<rect width="1400" height="900" fill="#fff"/>
<text x="52" y="70" font-family="Arial, sans-serif" font-size="42" fill="#172c38" font-weight="700" text-anchor="start">The extra instructions prepare the machine</text><text x="52" y="128" font-family="Arial, sans-serif" font-size="29" fill="#172c38" font-weight="400" text-anchor="start">Wizardry VII adds these five bytes at each of the five entries.</text><rect x="52" y="185" width="365" height="86" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="78" y="238" font-family="Consolas, monospace" font-size="33" fill="#172c38" font-weight="400" text-anchor="start">cld</text><path d="M435,228 L495,228" stroke="#006d77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="525" y="224" font-family="Arial, sans-serif" font-size="29" fill="#172c38" font-weight="400" text-anchor="start">Clear DF for forward string operations</text><text x="525" y="258" font-family="Arial, sans-serif" font-size="23" fill="#465e6b" font-weight="400" text-anchor="start">1 byte</text><rect x="52" y="310" width="365" height="86" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="78" y="363" font-family="Consolas, monospace" font-size="33" fill="#172c38" font-weight="400" text-anchor="start">mov ax, ds</text><path d="M435,353 L495,353" stroke="#006d77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="525" y="349" font-family="Arial, sans-serif" font-size="29" fill="#172c38" font-weight="400" text-anchor="start">Copy the data segment value into AX</text><text x="525" y="383" font-family="Arial, sans-serif" font-size="23" fill="#465e6b" font-weight="400" text-anchor="start">2 bytes</text><rect x="52" y="435" width="365" height="86" rx="8" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="2"/><text x="78" y="488" font-family="Consolas, monospace" font-size="33" fill="#172c38" font-weight="400" text-anchor="start">mov es, ax</text><path d="M435,478 L495,478" stroke="#006d77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="525" y="474" font-family="Arial, sans-serif" font-size="29" fill="#172c38" font-weight="400" text-anchor="start">Copy that value from AX into ES</text><text x="525" y="508" font-family="Arial, sans-serif" font-size="23" fill="#465e6b" font-weight="400" text-anchor="start">2 bytes</text><rect x="52" y="580" width="1296" height="98" rx="8" fill="#e7f4f4" stroke="#006d77" stroke-width="2"/><text x="78" y="622" font-family="Arial, sans-serif" font-size="35" fill="#006d77" font-weight="700" text-anchor="start">DS → AX → ES</text><text x="78" y="657" font-family="Arial, sans-serif" font-size="25" fill="#172c38" font-weight="400" text-anchor="start">A segment value passes through AX because DS cannot be moved directly to ES.</text><text x="52" y="738" font-family="Arial, sans-serif" font-size="31" fill="#172c38" font-weight="700" text-anchor="start">5 functions × 5 bytes = 25 added bytes</text><text x="52" y="790" font-family="Arial, sans-serif" font-size="28" fill="#172c38" font-weight="400" text-anchor="start">Two field functions also gain PUSH ES and POP ES: 4 more bytes.</text><text x="52" y="845" font-family="Arial, sans-serif" font-size="29" fill="#006d77" font-weight="700" text-anchor="start">29 extra bytes. The 200 bytes doing the bit work stay the same.</text></svg>