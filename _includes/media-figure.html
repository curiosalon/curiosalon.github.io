{% assign media = site.data.media[include.image_path] %}
{% assign largest = media.variants | last %}
<figure class="{{ include.class }}">
  <a href="{{ include.image_path | relative_url }}" aria-label="View full-size image: {{ include.alt | escape }}">
    <img src="{{ largest.url | default: include.image_path | relative_url }}"
      {% if media %}srcset="{% for variant in media.variants %}{{ variant.url | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
      sizes="(min-width: 1280px) 900px, (min-width: 1024px) 760px, calc(100vw - 32px)"
      width="{{ media.width }}" height="{{ media.height }}"{% endif %}
      loading="lazy" decoding="async" alt="{{ include.alt | escape }}">
  </a>
  {% if include.caption %}<figcaption>{{ include.caption | markdownify | remove: '<p>' | remove: '</p>' }}</figcaption>{% endif %}
</figure>
